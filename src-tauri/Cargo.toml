[package]
name = "codex-rosetta-desktop"
version = "0.1.0"
description = "Local desktop shell for Codex-Rosetta"
edition = "2024"
rust-version = "1.88"

[lib]
name = "codex_rosetta_desktop"
path = "src/lib.rs"

[[bin]]
name = "codex-rosetta-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.5", features = [] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"
